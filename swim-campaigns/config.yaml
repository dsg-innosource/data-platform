# Swim Campaigns Configuration

# Database connection is loaded from shared config
# See: shared/database.yaml

# Tables used for swim campaigns
tables:
  applicants: "bronze.portal_applicants"
  resume_scores: "bronze.portal_resume_scores"
  job_listings: "bronze.portal_applicant_job_listings"
  statuses: "bronze.portal_applicant_statuses"
  requisitions: "bronze.portal_requisitions"
  adp_tenure: "bronze.adp_tenure_history"

# Default output settings
output:
  format: "csv"
  include_query: true  # Save the SQL query used
